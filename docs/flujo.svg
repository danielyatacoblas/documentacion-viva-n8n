<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1180" viewBox="0 0 2000 1180" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">Documentación viva + asistente · lo que se escribe solo y lo que no</title><desc id="d">Tres tareas que consumían horas cada semana, con la línea marcada en el sitio exacto donde hace falta criterio. Las cifras salen de data/, fichas/ y los propios workflows.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="48" y="52" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">Documentación viva + asistente · lo que se escribe solo y lo que no</text><text x="48" y="82" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Tres tareas que consumían horas cada semana, con la línea marcada en el sitio exacto donde hace falta criterio. Las</text><text x="48" y="102" font-size="14" font-weight="400" fill="#475569" text-anchor="start">cifras salen de data/, fichas/ y los propios workflows.</text><rect x="60" y="150" width="360" height="900" rx="18" fill="#e2e8f0" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="76" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">FUENTE</text><text x="76" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Lo que ya existe</text><rect x="460" y="150" width="360" height="900" rx="18" fill="#ede9fe" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="476" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">SE DERIVA SOLO</text><text x="476" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Sin que nadie escriba</text><rect x="860" y="150" width="340" height="900" rx="18" fill="#fee2e2" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="876" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">CRITERIO HUMANO</text><text x="876" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Lo que no se automatiza</text><rect x="1240" y="150" width="340" height="900" rx="18" fill="#dbeafe" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="1256" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">SALIDA</text><text x="1256" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Lo que queda por escrito</text><rect x="1620" y="150" width="320" height="900" rx="18" fill="#dcfce7" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="1636" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">VALOR</text><text x="1636" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Qué gana el equipo</text><path d="M 400 300 H 440.0 V 300 H 480" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="440.0" y="290" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">se lee</text><path d="M 800 300 H 1030.0 V 280 H 1260" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1030.0" y="270" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">5 de 7 secciones</text><path d="M 400 620 H 440.0 V 620 H 480" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="440.0" y="610" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">llega</text><path d="M 800 620 H 840.0 V 400 H 880" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="840.0" y="390" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">clasificado</text><path d="M 1180 400 H 1220.0 V 560 H 1260" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1220.0" y="390" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">lo delicado</text><path d="M 1180 700 H 1220.0 V 830 H 1260" fill="none" stroke="#334155" stroke-width="2.2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="1220.0" y="690" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">el resto</text><path d="M 1560 280 H 1600.0 V 300 H 1640" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M 1560 560 H 1600.0 V 540 H 1640" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M 1560 830 H 1600.0 V 780 H 1640" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="80" y="220" width="320" height="190" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="96" y="232" width="69.6" height="20" rx="10" fill="#e2e8f0"/><text x="130.8" y="246" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">YA EXISTE</text><text x="96" y="274" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">El JSON del workflow</text><text x="96" y="299" font-size="11" font-weight="400" fill="#475569" text-anchor="start">El archivo que n8n ya guarda. No hay</text><text x="96" y="315" font-size="11" font-weight="400" fill="#475569" text-anchor="start">que mantener nada aparte: la fuente</text><text x="96" y="331" font-size="11" font-weight="400" fill="#475569" text-anchor="start">de la documentación es el flujo</text><text x="96" y="347" font-size="11" font-weight="400" fill="#475569" text-anchor="start">mismo.</text><line x1="96" y1="355" x2="384" y2="355" stroke="#e2e8f0" stroke-width="1.5"/><text x="96" y="371" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">flujos documentados</text><text x="384" y="371" font-size="12" font-weight="700" fill="#334155" text-anchor="end">5</text><text x="96" y="390" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">nodos leídos</text><text x="384" y="390" font-size="12" font-weight="700" fill="#334155" text-anchor="end">65</text><rect x="80" y="540" width="320" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="96" y="552" width="69.6" height="20" rx="10" fill="#e2e8f0"/><text x="130.8" y="566" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">YA EXISTE</text><text x="96" y="594" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">El correo que llega</text><text x="96" y="619" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Inscripciones, quejas, alianzas,</text><text x="96" y="635" font-size="11" font-weight="400" fill="#475569" text-anchor="start">voluntariado. Todo al mismo buzón,</text><text x="96" y="651" font-size="11" font-weight="400" fill="#475569" text-anchor="start">todo mezclado.</text><line x1="96" y1="659" x2="384" y2="659" stroke="#e2e8f0" stroke-width="1.5"/><text x="96" y="675" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">correos del periodo</text><text x="384" y="675" font-size="12" font-weight="700" fill="#334155" text-anchor="end">30</text><text x="96" y="694" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">categorías distintas</text><text x="384" y="694" font-size="12" font-weight="700" fill="#334155" text-anchor="end">7</text><rect x="480" y="220" width="320" height="230" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="496" y="232" width="76.0" height="20" rx="10" fill="#ede9fe"/><text x="534.0" y="246" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">AUTOMÁTICO</text><text x="496" y="274" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Generador de fichas</text><text x="496" y="299" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Disparadores, servicios, orden real</text><text x="496" y="315" font-size="11" font-weight="400" fill="#475569" text-anchor="start">de ejecución, credenciales</text><text x="496" y="331" font-size="11" font-weight="400" fill="#475569" text-anchor="start">pendientes y nodos sin ruta de</text><text x="496" y="347" font-size="11" font-weight="400" fill="#475569" text-anchor="start">error: todo se deriva del archivo.</text><line x1="496" y1="355" x2="784" y2="355" stroke="#e2e8f0" stroke-width="1.5"/><text x="496" y="371" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">lo escribe una persona</text><text x="784" y="371" font-size="12" font-weight="700" fill="#92400e" text-anchor="end">2 de 7</text><text x="496" y="390" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">se deriva del JSON</text><text x="784" y="390" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="end">5 de 7</text><rect x="480" y="540" width="320" height="230" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="496" y="552" width="82.4" height="20" rx="10" fill="#ede9fe"/><text x="537.2" y="566" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">IA O REGLAS</text><text x="496" y="594" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Clasificar y redactar</text><text x="496" y="619" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Categoría, prioridad y un borrador</text><text x="496" y="635" font-size="11" font-weight="400" fill="#475569" text-anchor="start">de respuesta. Sin Claude funciona</text><text x="496" y="651" font-size="11" font-weight="400" fill="#475569" text-anchor="start">igual con reglas: el flujo no</text><text x="496" y="667" font-size="11" font-weight="400" fill="#475569" text-anchor="start">depende de que la IA esté.</text><line x1="496" y1="675" x2="784" y2="675" stroke="#e2e8f0" stroke-width="1.5"/><text x="496" y="691" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">prioridad alta</text><text x="784" y="691" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="end">3</text><text x="496" y="710" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">media</text><text x="784" y="710" font-size="12" font-weight="700" fill="#92400e" text-anchor="end">18</text><text x="496" y="729" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">baja</text><text x="784" y="729" font-size="12" font-weight="700" fill="#166534" text-anchor="end">9</text><rect x="880" y="300" width="300" height="290" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="896" y="312" width="114.4" height="20" rx="10" fill="#fee2e2"/><text x="953.2" y="326" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">NO SE AUTOMATIZA</text><text x="896" y="354" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Lo que exige una persona</text><text x="896" y="379" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Quejas, alianzas y urgencias no las</text><text x="896" y="395" font-size="11" font-weight="400" fill="#475569" text-anchor="start">contesta un borrador. El sistema las</text><text x="896" y="411" font-size="11" font-weight="400" fill="#475569" text-anchor="start">marca y las sube al principio de la</text><text x="896" y="427" font-size="11" font-weight="400" fill="#475569" text-anchor="start">cola, pero no las responde.</text><text x="896" y="443" font-size="11" font-weight="400" fill="#475569" text-anchor="start"></text><text x="896" y="459" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Saber qué NO automatizar es la</text><text x="896" y="475" font-size="11" font-weight="400" fill="#475569" text-anchor="start">mitad del trabajo.</text><line x1="896" y1="483" x2="1164" y2="483" stroke="#e2e8f0" stroke-width="1.5"/><text x="896" y="499" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">van a una persona</text><text x="1164" y="499" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="end">8</text><text x="896" y="518" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">spam, fuera sin más</text><text x="1164" y="518" font-size="12" font-weight="700" fill="#64748b" text-anchor="end">2</text><rect x="880" y="660" width="300" height="190" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="896" y="672" width="63.2" height="20" rx="10" fill="#fee2e2"/><text x="927.6" y="686" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">CRITERIO</text><text x="896" y="714" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Qué hacer si falla</text><text x="896" y="739" font-size="11" font-weight="400" fill="#475569" text-anchor="start">De cada ficha, esta sección y la de</text><text x="896" y="755" font-size="11" font-weight="400" fill="#475569" text-anchor="start">intención las escribe alguien: la</text><text x="896" y="771" font-size="11" font-weight="400" fill="#475569" text-anchor="start">intención no está en el JSON.</text><line x1="896" y1="779" x2="1164" y2="779" stroke="#e2e8f0" stroke-width="1.5"/><text x="896" y="795" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">borradores a revisar</text><text x="1164" y="795" font-size="12" font-weight="700" fill="#1e40af" text-anchor="end">28</text><rect x="1260" y="210" width="300" height="165" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1276" y="236" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Ficha en Markdown</text><text x="1276" y="261" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Una por flujo, en el repositorio,</text><text x="1276" y="277" font-size="11" font-weight="400" fill="#475569" text-anchor="start">versionada junto al código.</text><line x1="1276" y1="285" x2="1544" y2="285" stroke="#e2e8f0" stroke-width="1.5"/><text x="1276" y="301" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">fichas al día</text><text x="1544" y="301" font-size="12" font-weight="700" fill="#166534" text-anchor="end">5</text><rect x="1260" y="480" width="300" height="165" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1276" y="506" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Bandeja priorizada</text><text x="1276" y="531" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Ordenada por lo que no puede</text><text x="1276" y="547" font-size="11" font-weight="400" fill="#475569" text-anchor="start">esperar, no por hora de llegada.</text><line x1="1276" y1="555" x2="1544" y2="555" stroke="#e2e8f0" stroke-width="1.5"/><text x="1276" y="571" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">correos priorizados</text><text x="1544" y="571" font-size="12" font-weight="700" fill="#166534" text-anchor="end">30</text><rect x="1260" y="750" width="300" height="180" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1276" y="776" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Reporte semanal</text><text x="1276" y="801" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Qué mejoró, qué empeoró, qué</text><text x="1276" y="817" font-size="11" font-weight="400" fill="#475569" text-anchor="start">revisar. Sacado de los KPIs del</text><text x="1276" y="833" font-size="11" font-weight="400" fill="#475569" text-anchor="start">panel, no de la impresión de nadie.</text><line x1="1276" y1="841" x2="1544" y2="841" stroke="#e2e8f0" stroke-width="1.5"/><text x="1276" y="857" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">secciones</text><text x="1544" y="857" font-size="12" font-weight="700" fill="#166534" text-anchor="end">5</text><rect x="1640" y="220" width="280" height="185" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="1656" y="232" width="44.0" height="20" rx="10" fill="#dcfce7"/><text x="1678.0" y="246" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">VALOR</text><text x="1656" y="274" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Quien está de turno tiene</text><text x="1656" y="293" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">dónde mirar</text><text x="1656" y="318" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Cuando algo falla un sábado y no</text><text x="1656" y="334" font-size="11" font-weight="400" fill="#475569" text-anchor="start">está quien lo montó.</text><rect x="1640" y="460" width="280" height="185" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="1656" y="472" width="44.0" height="20" rx="10" fill="#dcfce7"/><text x="1678.0" y="486" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">VALOR</text><text x="1656" y="514" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">El correo urgente no se pierde</text><text x="1656" y="539" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Deja de depender de quién abrió</text><text x="1656" y="555" font-size="11" font-weight="400" fill="#475569" text-anchor="start">primero la bandeja.</text><rect x="1640" y="700" width="280" height="185" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="1656" y="712" width="44.0" height="20" rx="10" fill="#dcfce7"/><text x="1678.0" y="726" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">VALOR</text><text x="1656" y="754" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">La documentación no puede</text><text x="1656" y="773" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">mentir</text><text x="1656" y="798" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Se regenera del flujo. Si cambia,</text><text x="1656" y="814" font-size="11" font-weight="400" fill="#475569" text-anchor="start">la ficha cambia con él.</text><rect x="48" y="1090" width="1904" height="52" rx="12" fill="#e2e8f0"/><text x="70" y="1122" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">La ficha se deriva del JSON del workflow: cuando el flujo cambia, se regenera y vuelve a decir la verdad. Una documentación que no puede quedarse desactualizada sin que alguien lo note.</text></svg>