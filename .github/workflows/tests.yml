# Corre la suite completa en cada push y en cada pull request.
# Además verifica que la documentación siga sincronizada con los workflows:
# si alguien cambia un workflow y no regenera las fichas, el build falla.

name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar la bandeja ficticia
        run: python scripts/generar_correos.py

      - name: Verificar que los workflows se construyen desde el código fuente
        run: |
          python scripts/build_workflow.py
          git diff --exit-code workflows/*.json \
            || (echo "::error::Los workflows JSON no coinciden con workflows/src/*.js. Corre: python scripts/build_workflow.py" && exit 1)

      - name: Correr los tests
        run: python -m pytest tests/ -v

      # La razón de ser de este proyecto: documentación que no se desactualiza.
      # Si el workflow cambió y las fichas no se regeneraron, esto falla.
      # Se ignora la línea de fecha de generación: cambia cada día sin que el
      # contenido de la ficha haya cambiado realmente.
      - name: Verificar que la documentación está al día
        run: |
          python scripts/generar_fichas.py
          git diff --exit-code -I'Última generación' -- fichas/ \
            || (echo "::error::Las fichas no coinciden con los workflows. Corre: python scripts/generar_fichas.py" && exit 1)
